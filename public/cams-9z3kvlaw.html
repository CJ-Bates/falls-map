      { id:"boundary", type:"line", source:"boundary", paint:{ "line-color":"#2A1F18", "line-width":3 } },
    ],
  },
  center:[-90.4595, 38.4065], zoom:15, maxPitch:0, attributionControl:{ compact:true },
});
map.addControl(new maplibregl.ScaleControl({ unit:"imperial" }), "bottom-left");

// Fit to cameras + a little breathing room
const b = new maplibregl.LngLatBounds();
CAMS.forEach(c => b.extend([c.lon, c.lat]));
map.fitBounds(b, { padding:{ top:110, bottom:150, left:40, right:40 }, maxZoom:16.2, duration:0 });

// Basemap toggle
document.querySelectorAll("#style button").forEach(btn => btn.onclick = () => {
  const sat = btn.dataset.s === "sat";
  document.querySelectorAll("#style button").forEach(x => x.classList.toggle("on", x === btn));
  ["esri","ortho"].forEach(id => map.setLayoutProperty(id, "visibility", sat ? "visible" : "none"));
  ["relief","contour","contour-idx"].forEach(id => map.setLayoutProperty(id, "visibility", sat ? "none" : "visible"));
  map.setPaintProperty("trail", "line-color", sat
    ? ["match",["get","surface"],"gravel","#D9C39A","4wd","#E05A2B","#FFF3D6"]
    : ["match",["get","surface"],"gravel","#B89968","4wd","#D9471F","#2A1F18"]);
  map.setPaintProperty("trail-label", "text-color", sat ? "#FFF3D6" : "#2A1F18");
  map.setPaintProperty("trail-label", "text-halo-color", sat ? "#1a1310" : "#F5E8C9");
});

// Camera pins
const camIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="#F0E2C2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const markers = [];
let popup = null;
function show(i) {
  const c = CAMS[i];
  markers.forEach((m, k) => m.getElement().classList.toggle("on", k === i));
  document.querySelectorAll(".cam").forEach((el, k) => el.classList.toggle("on", k === i));
  if (popup) popup.remove();
  const ll = c.lat.toFixed(5) + ", " + c.lon.toFixed(5);
  popup = new maplibregl.Popup({ offset:22, maxWidth:"260px" })
    .setLngLat([c.lon, c.lat])
    .setHTML(`<div class="pp"><b>${c.name}</b><div class="c">${ll}</div>` +
      `<a href="https://maps.apple.com/?ll=${c.lat},${c.lon}&q=${encodeURIComponent(c.name)}">Apple Maps</a>` +
      `<a href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lon}">Google Maps</a></div>`)
    .addTo(map);
  map.easeTo({ center:[c.lon, c.lat], zoom:Math.max(map.getZoom(), 16.3), duration:600 });
}
CAMS.forEach((c, i) => {
  const el = document.createElement("div"); el.className = "pin"; el.innerHTML = camIcon; el.title = c.name;
  el.onclick = (e) => { e.stopPropagation(); show(i); };
  markers.push(new maplibregl.Marker({ element: el, anchor:"center" }).setLngLat([c.lon, c.lat]).addTo(map));
  const btn = document.createElement("button"); btn.className = "cam";
  btn.innerHTML = `<b>${c.name}</b><span>${c.zone}</span>`; btn.onclick = () => show(i);
  document.getElementById("row").appendChild(btn);
});

// My location
let me = null, watch = null;
document.getElementById("locate").onclick = () => {
  if (!navigator.geolocation) return alert("Location isn't available on this device.");
  if (watch !== null) { navigator.geolocation.clearWatch(watch); watch = null; me?.remove(); me = null; return; }
  watch = navigator.geolocation.watchPosition((p) => {
    const ll = [p.coords.longitude, p.coords.latitude];
    if (!me) { const d = document.createElement("div"); d.className = "me"; me = new maplibregl.Marker({ element:d }).setLngLat(ll).addTo(map); map.easeTo({ center: ll, zoom: Math.max(map.getZoom(), 16) }); }
    else me.setLngLat(ll);
  }, (e) => alert("Couldn't get your location: " + e.message), { enableHighAccuracy:true, maximumAge:3000, timeout:20000 });
};
</script>
</body>
</html>
