<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trace cleared areas · The Falls</title>
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0e0a08; font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; color: #F0E2C2; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 12px; left: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto;
           background: rgba(42,31,24,.92); border: 1px solid rgba(240,226,194,.18); border-radius: 16px; padding: 14px; z-index: 5;
           box-shadow: 0 18px 44px rgba(0,0,0,.5); }
  h1 { font-size: 15px; margin: 0 0 6px; }
  p { font-size: 12px; line-height: 1.4; color: rgba(240,226,194,.75); margin: 0 0 10px; }
  button { font: inherit; font-size: 13px; font-weight: 600; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer;
           background: #B89968; color: #1a1310; margin: 0 6px 6px 0; }
  button.secondary { background: rgba(240,226,194,.12); color: #F0E2C2; }
  button:disabled { opacity: .4; cursor: default; }
  ul { list-style: none; padding: 0; margin: 8px 0; font-size: 13px; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-top: 1px solid rgba(240,226,194,.1); }
  li span.x { cursor: pointer; color: #cdac7d; }
  textarea { width: 100%; height: 120px; box-sizing: border-box; font: 11px/1.3 ui-monospace, Menlo, monospace; background: #1a1310; color: #F0E2C2;
             border: 1px solid rgba(240,226,194,.18); border-radius: 8px; padding: 8px; }
  .hint { font-size: 11px; color: rgba(240,226,194,.55); }
  kbd { font: 11px ui-monospace, monospace; background: rgba(240,226,194,.15); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Trace the cleared areas</h1>
  <p>Click around each area that has been cleared of trees since 2021 — cabin pads, the ridge, pasture, pavilion lawns, wide road cuts. Doesn't need to be perfect; ±10 ft is fine.</p>
  <p class="hint"><kbd>click</kbd> add point · <kbd>Z</kbd> undo point · <kbd>Enter</kbd> finish area · <kbd>Esc</kbd> cancel · scroll to zoom, drag to pan</p>
  <div>
    <button id="finish" disabled>Finish area (Enter)</button>
    <button id="undo" class="secondary" disabled>Undo (Z)</button>
  </div>
  <ul id="list"></ul>
  <div>
    <button id="export" disabled>Copy GeoJSON</button>
    <button id="clear" class="secondary">Start over</button>
  </div>
  <textarea id="out" readonly placeholder="GeoJSON appears here — paste it back to Claude"></textarea>
</div>
<script>
const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      esri: { type: "raster", tileSize: 256, maxzoom: 19,
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"] },
      ortho: { type: "raster", tileSize: 512, minzoom: 12, maxzoom: 18, tiles: ["/tiles/ortho/{z}/{x}/{y}.webp"],
        bounds: [-90.4855, 38.3835, -90.4285, 38.4275] },
      contours: { type: "geojson", data: "/tiles/contours.json" },
    },
    layers: [
      { id: "esri", type: "raster", source: "esri" },
      { id: "ortho", type: "raster", source: "ortho" },
      { id: "contours", type: "line", source: "contours", filter: ["==", ["get", "idx"], 1],
        paint: { "line-color": "#F5E8C9", "line-width": 0.8, "line-opacity": 0.35 } },
    ],
  },
  center: [-90.457, 38.4055], zoom: 15.5, maxPitch: 0, dragRotate: false,
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
map.addControl(new maplibregl.ScaleControl({ unit: "imperial" }), "bottom-right");

const areas = [];        // finished: { name, coords: [[lng,lat],...] }
let current = [];        // in-progress vertices
const $ = (id) => document.getElementById(id);

function fc() {
  return { type: "FeatureCollection", features: [
    ...areas.map((a, i) => ({ type: "Feature", properties: { name: a.name, id: i },
      geometry: { type: "Polygon", coordinates: [[...a.coords, a.coords[0]]] } })),
  ] };
}
function currentFc() {
  const ring = current.length >= 3 ? [[...current, current[0]]] : null;
  return { type: "FeatureCollection", features: [
    ...(current.length >= 2 ? [{ type: "Feature", properties: { kind: "line" }, geometry: { type: "LineString", coordinates: current } }] : []),
    ...(ring ? [{ type: "Feature", properties: { kind: "fill" }, geometry: { type: "Polygon", coordinates: ring } }] : []),
    ...current.map((c) => ({ type: "Feature", properties: { kind: "pt" }, geometry: { type: "Point", coordinates: c } })),
  ] };
}
function refresh() {
  map.getSource("areas").setData(fc());
  map.getSource("current").setData(currentFc());
  $("finish").disabled = current.length < 3;
  $("undo").disabled = current.length === 0;
  $("export").disabled = areas.length === 0;
  $("list").innerHTML = areas.map((a, i) =>
    `<li><span>${a.name} <span class="hint">(${a.coords.length} pts)</span></span><span class="x" data-i="${i}">remove</span></li>`).join("");
  $("list").querySelectorAll(".x").forEach((el) => el.onclick = () => { areas.splice(+el.dataset.i, 1); refresh(); });
}
function finish() {
  if (current.length < 3) return;
  const name = prompt("Name this area (e.g. Cabin Ridge, Horse Pasture, Main Lake lawn):", "Cleared " + (areas.length + 1));
  if (name === null) return;
  areas.push({ name: name.trim() || "Cleared " + (areas.length + 1), coords: current });
  current = [];
  refresh();
}
map.on("load", () => {
  map.addSource("areas", { type: "geojson", data: fc() });
  map.addSource("current", { type: "geojson", data: currentFc() });
  map.addLayer({ id: "areas-fill", type: "fill", source: "areas", paint: { "fill-color": "#3a82c2", "fill-opacity": 0.28 } });
  map.addLayer({ id: "areas-line", type: "line", source: "areas", paint: { "line-color": "#8fc3ff", "line-width": 2 } });
  map.addLayer({ id: "areas-label", type: "symbol", source: "areas",
    layout: { "text-field": ["get", "name"], "text-size": 13, "text-font": ["Open Sans Bold", "Arial Unicode MS Bold"] },
    paint: { "text-color": "#fff", "text-halo-color": "#1a1310", "text-halo-width": 1.5 } });
  map.addLayer({ id: "cur-fill", type: "fill", source: "current", filter: ["==", ["get", "kind"], "fill"], paint: { "fill-color": "#ffcc55", "fill-opacity": 0.2 } });
  map.addLayer({ id: "cur-line", type: "line", source: "current", filter: ["==", ["get", "kind"], "line"], paint: { "line-color": "#ffcc55", "line-width": 2, "line-dasharray": [2, 1] } });
  map.addLayer({ id: "cur-pt", type: "circle", source: "current", filter: ["==", ["get", "kind"], "pt"],
    paint: { "circle-radius": 5, "circle-color": "#ffcc55", "circle-stroke-color": "#1a1310", "circle-stroke-width": 1.5 } });
  refresh();
});
map.on("click", (e) => { current.push([+e.lngLat.lng.toFixed(6), +e.lngLat.lat.toFixed(6)]); refresh(); });
map.getCanvas().style.cursor = "crosshair";
$("finish").onclick = finish;
$("undo").onclick = () => { current.pop(); refresh(); };
$("clear").onclick = () => { if (confirm("Remove all traced areas?")) { areas.length = 0; current = []; refresh(); $("out").value = ""; } };
$("export").onclick = async () => {
  const txt = JSON.stringify(fc());
  $("out").value = txt;
  try { await navigator.clipboard.writeText(txt); $("export").textContent = "Copied ✓"; setTimeout(() => $("export").textContent = "Copy GeoJSON", 1500); } catch {}
};
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "Enter") finish();
  else if (e.key.toLowerCase() === "z") { current.pop(); refresh(); }
  else if (e.key === "Escape") { current = []; refresh(); }
});
</script>
</body>
</html>
